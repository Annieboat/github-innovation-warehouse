[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "github-innovation-warehouse"
version = "0.1.0"
description = "Reproducible collection and analysis of public GitHub organization activity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "tenacity>=8.5,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]
bigquery = [
  "google-cloud-bigquery>=3.25,<4",
]

[project.scripts]
ghiw = "github_innovation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/github_innovation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".deps", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
